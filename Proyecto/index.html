<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Over-Drive Guitarras </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id ="cabecera">
        <div id="logo">
            <h1> Overdrive </h1>
        </div>
        <nav id="nav">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Tienda</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>       
    </header>
    <!--banner principal-->
    <section id="banner">
        <div id ="texto-banner">

            <p>Calidad, buenos precios y la mejor seleccion de guitarras para todos los estilos </p>

        <div id="imagen-banner">
            <img src="imagenes/Diseño_Web_WireFrames-removebg-preview.png" alt="Guitarra">

            </div>
            <div class="tarjeta-categoria">
                <img src="imagenes/electrica.png" alt="Electrica">
                <h3>Electricas</h3>
            </div>
            <div class="tarjeta-categoria">
                <img src="imagenes/amplificador.png" alt="Amplificador">
